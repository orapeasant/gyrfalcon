[project]
name = "gyrfalcon"
version = "0.1.0"
description = "Gyrfalcon — A self-improving AI agent with persistent memory, session management, skill creation, and pluggable infrastructure"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
    { name = "Gyrfalcon Team" }
]

dependencies = [
    "openai>=1.40.0",
    "anthropic>=0.34.0",
    "boto3>=1.35.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0",
    "rich>=13.7",
    "prompt-toolkit>=3.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "websockets>=12.0",
    "pydantic>=2.7",
    "aiosqlite>=0.20.0",
    "python-dotenv>=1.0",
    "croniter>=2.0",
    "filelock>=3.15",
    "click>=8.1",
    # OpenTelemetry for observability
    "opentelemetry-api>=1.25.0",
    "opentelemetry-sdk>=1.25.0",
    "opentelemetry-instrumentation-fastapi>=0.46b0",
    "opentelemetry-instrumentation-httpx>=0.46b0",
    "opentelemetry-exporter-otlp>=1.25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]
# PostgreSQL flow store (spec 15-flow.md §15.3a). Optional on purpose: SQLite is
# the default backend and needs nothing installed, so a single-box install stays
# dependency-free. pg8000 is pure Python — no libpq, no build step.
postgres = [
    "pg8000>=1.31",
]
flow-samples = [
    "langgraph>=1.2.11",
]

[project.scripts]
gyrfalcon = "gyrfalcon_cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.hatch.build.targets.wheel]
packages = ["gyrfalcon", "gyrfalcon_cli", "tui_gateway"]

[dependency-groups]
dev = [
    "pyinstaller>=6.22.2",
]
